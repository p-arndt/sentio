name: Build and Publish Release
permissions:
    contents: read
    packages: write

on:
    push:
        tags: ["*"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: "10"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Run tests
              run: pnpm run test

            - name: Extract tag name
              id: get_tag
              run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker Hub image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: VERSION=${{ steps.get_tag.outputs.VERSION }}
                  tags: |
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:${{ steps.get_tag.outputs.VERSION }}
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:latest
                  cache-from: type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:latest
                  cache-to: type=inline

            - name: Build and push GHCR image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: VERSION=${{ steps.get_tag.outputs.VERSION }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/sentio:${{ steps.get_tag.outputs.VERSION }}
                      ghcr.io/${{ github.repository_owner }}/sentio:latest
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/sentio:latest
                  cache-to: type=inline
