name: Build and Publish Release
permissions:
  contents: write
  packages: write

on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Extract tag name
        id: get_tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images (Docker Hub + GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.get_tag.outputs.VERSION }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:${{ steps.get_tag.outputs.VERSION }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:latest
            ghcr.io/${{ github.repository_owner }}/sentio:${{ steps.get_tag.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/sentio:latest
          cache-from: |
            type=registry,ref=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sentio:latest
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/sentio:latest
          cache-to: type=inline

      - name: Generate changelog (git-chglog action)
        id: gen_changelog
        uses: bdashrad/git-chglog-action@v2.0.3
        with:
          # next_version is required by the action - set it to the tag we're releasing
          next_version: ${{ steps.get_tag.outputs.VERSION }}

      - name: Write RELEASE_NOTES.md
        run: |
          VERSION=${{ steps.get_tag.outputs.VERSION }}
          echo "## 🚀 Release $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          # Append changelog from the action output
          echo "${{ steps.gen_changelog.outputs.changelog }}" >> RELEASE_NOTES.md
          echo "🔖 Generated notes:"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
